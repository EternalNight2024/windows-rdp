name: Windows RDP with Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. 启用远程桌面并放行防火墙
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. 创建管理员账户
        env:
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          $Password = ConvertTo-SecureString "$env:PASSWORD" -AsPlainText -Force
          New-LocalUser -Name "RDPUser" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "RDPUser" -ErrorAction SilentlyContinue
          net user runneradmin "$env:PASSWORD"

      - name: 3. 安装 Cloudflared 并建立隧道
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          Write-Host "正在下载 cloudflared..."
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "$env:USERPROFILE\cloudflared.exe"
          
          $env:Path += ";$env:USERPROFILE"
          
          Write-Host "正在安装 Cloudflare Tunnel 服务..."
          & "$env:USERPROFILE\cloudflared.exe" service install $Env:CLOUDFLARE_TOKEN
          
          Write-Host "正在启动 Cloudflare Tunnel 服务..."
          Start-Service cloudflared
          
          Write-Host "等待服务稳定 (约15秒)..."
          Start-Sleep -Seconds 15
          
          $serviceStatus = Get-Service cloudflared
          Write-Host "当前服务状态: $($serviceStatus.Status)" -ForegroundColor Yellow
          
          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  >>> RDP 远程桌面服务已就绪！ <<<" -ForegroundColor Cyan
          Write-Host "  请登录 Cloudflare Zero Trust 面板查看隧道状态。" -ForegroundColor Yellow
          Write-Host "  您的RDP连接地址为您在 Cloudflare 配置的域名。" -ForegroundColor Yellow
          Write-Host "  例如: rdp.your-domain.com" -ForegroundColor Magenta
          Write-Host "  用户名: RDPUser" -ForegroundColor Green
          Write-Host "  密码: $env:PASSWORD" -ForegroundColor Green
          Write-Host "==========================================" -ForegroundColor Green

      # ========== 新增：验证服务状态 ==========
      - name: 3.5 验证 RDP 服务与网络状态
        run: |
          Write-Host ""
          Write-Host "========== 开始验证 RDP 服务状态 ==========" -ForegroundColor Cyan
          
          # 1. 检查 RDP 服务是否运行
          Write-Host "1. 检查远程桌面服务 (TermService) 状态..."
          $termService = Get-Service -Name TermService
          Write-Host "   服务状态: $($termService.Status)" -ForegroundColor Yellow
          if ($termService.Status -ne 'Running') {
              Write-Host "   警告: RDP 服务未运行！尝试启动..." -ForegroundColor Red
              Start-Service -Name TermService
              Start-Sleep -Seconds 3
              $termService = Get-Service -Name TermService
              Write-Host "   启动后状态: $($termService.Status)" -ForegroundColor Yellow
          }
          
          # 2. 检查 3389 端口监听状态
          Write-Host ""
          Write-Host "2. 检查 3389 端口监听状态..."
          $portCheck = netstat -an | Select-String ":3389"
          if ($portCheck) {
              Write-Host "   3389 端口监听状态:" -ForegroundColor Yellow
              $portCheck | ForEach-Object { Write-Host "   $_" -ForegroundColor Gray }
          } else {
              Write-Host "   警告: 未找到 3389 端口的监听记录！" -ForegroundColor Red
          }
          
          # 3. 检查防火墙规则
          Write-Host ""
          Write-Host "3. 检查远程桌面防火墙规则..."
          $firewallRule = Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          if ($firewallRule) {
              $enabledRules = $firewallRule | Where-Object { $_.Enabled -eq $True }
              Write-Host "   已启用规则数: $($enabledRules.Count)" -ForegroundColor Yellow
              $enabledRules | ForEach-Object { Write-Host "   - $($_.DisplayName)" -ForegroundColor Gray }
          } else {
              Write-Host "   警告: 未找到远程桌面防火墙规则！" -ForegroundColor Red
          }
          
          # 4. 检查 Cloudflared 服务状态
          Write-Host ""
          Write-Host "4. 检查 Cloudflared 服务状态..."
          $cfService = Get-Service -Name cloudflared -ErrorAction SilentlyContinue
          if ($cfService) {
              Write-Host "   服务状态: $($cfService.Status)" -ForegroundColor Yellow
              if ($cfService.Status -ne 'Running') {
                  Write-Host "   警告: Cloudflared 服务未运行！" -ForegroundColor Red
              }
          } else {
              Write-Host "   警告: 未找到 cloudflared 服务！" -ForegroundColor Red
          }
          
          # 5. 尝试用 cloudflared 查看隧道状态
          Write-Host ""
          Write-Host "5. 检查 Cloudflare 隧道连接状态..."
          $cfPath = "$env:USERPROFILE\cloudflared.exe"
          if (Test-Path $cfPath) {
              try {
                  $tunnelStatus = & $cfPath tunnel info 2>&1
                  if ($LASTEXITCODE -eq 0) {
                      Write-Host "   隧道连接: 正常" -ForegroundColor Green
                  } else {
                      Write-Host "   隧道连接: 异常 - $tunnelStatus" -ForegroundColor Red
                  }
              } catch {
                  Write-Host "   无法获取隧道状态: $_" -ForegroundColor Red
              }
          } else {
              Write-Host "   警告: 找不到 cloudflared.exe" -ForegroundColor Red
          }
          
          Write-Host ""
          Write-Host "========== 验证完成 ==========" -ForegroundColor Cyan

      - name: 4. 保持服务器运行 (48小时)
        run: |
          for ($i = 1; $i -le 2880; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/2880] 服务器持续运行中... (隧道服务状态: $(Get-Service cloudflared -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Status))"
          }
