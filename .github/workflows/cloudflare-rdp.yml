name: Windows RDP with Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 0. 设置系统语言为中文
        run: |
          Write-Host "正在设置系统语言为中文..."
          $langPack = Get-WindowsCapability -Online | Where-Object { $_.Name -like "Language.Basic~~~zh-CN*" -and $_.State -ne "Installed" }
          if ($langPack) {
              Add-WindowsCapability -Online -Name $langPack.Name
          }
          Set-WinSystemLocale -SystemLocale zh-CN
          Set-WinUserLanguageList -LanguageList zh-CN -Force
          Set-Culture -CultureInfo zh-CN
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Nls\Language" -Name "InstallLanguage" -Value "0804"
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Nls\Language" -Name "Default" -Value "0804"
          Write-Host "系统语言已设置为中文" -ForegroundColor Green

      - name: 1. 启用远程桌面并放行防火墙
        run: |
          Write-Host "正在配置远程桌面..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          Write-Host "远程桌面已启用，防火墙已放行" -ForegroundColor Green

      - name: 2. 创建管理员账户
        env:
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          Write-Host "正在创建管理员账户..."
          $Password = ConvertTo-SecureString "$env:PASSWORD" -AsPlainText -Force
          New-LocalUser -Name "RDPUser" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "RDPUser" -ErrorAction SilentlyContinue
          net user runneradmin "$env:PASSWORD"
          Write-Host "管理员账户 RDPUser 已创建" -ForegroundColor Green

      - name: 3. 安装 Cloudflared 并建立隧道
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          Write-Host "正在下载 cloudflared..."
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "$env:USERPROFILE\cloudflared.exe"
          $env:Path += ";$env:USERPROFILE"
          
          Write-Host "正在安装 Cloudflare Tunnel 服务..."
          & "$env:USERPROFILE\cloudflared.exe" service install $Env:CLOUDFLARE_TOKEN
          
          Write-Host "正在启动 Cloudflare Tunnel 服务..."
          Start-Service cloudflared
          Start-Sleep -Seconds 15
          
          $svc = Get-Service cloudflared
          if ($svc.Status -eq "Running") {
              Write-Host "Cloudflare Tunnel 服务已启动" -ForegroundColor Green
          } else {
              Write-Host "警告: 服务状态为 $($svc.Status)" -ForegroundColor Yellow
          }
          
          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  >>> RDP 服务已就绪 <<<" -ForegroundColor Cyan
          Write-Host "  域名: r.styx.cc.cd" -ForegroundColor Yellow
          Write-Host "  用户: RDPUser" -ForegroundColor Yellow
          Write-Host "  密码: $env:PASSWORD" -ForegroundColor Yellow
          Write-Host "==========================================" -ForegroundColor Green

      - name: 4. 保持服务器运行 (48小时)
        run: |
          Write-Host "开始保活，服务器将运行 48 小时" -ForegroundColor Cyan
          for ($i = 1; $i -le 2880; $i++) {
              Start-Sleep -Seconds 60
              if ($i % 60 -eq 0) {
                  Write-Host "[$i/2880] 已运行 $([math]::Round($i/60, 1)) 小时"
              }
          }
