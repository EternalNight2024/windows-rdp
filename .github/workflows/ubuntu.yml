name: Ubuntu Webtop with Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. 启动 webtop 容器
        run: |
          # 拉取 webtop 镜像（ubuntu + xfce 桌面）
          docker pull ghcr.io/linuxserver/webtop:ubuntu-xfce
          
          # 启动容器，映射 6080 端口到容器内的 3000
          docker run -d \
            --name=webtop \
            --shm-size=1gb \
            -p 6080:3000 \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Asia/Shanghai \
            ghcr.io/linuxserver/webtop:ubuntu-xfce
          
          # 等待容器内服务启动
          echo "等待 webtop 服务启动..."
          sleep 30
          
          # 验证 6080 端口是否在监听
          if ss -tlnp | grep -q ":6080"; then
            echo "webtop 已启动，监听 6080 端口"
          else
            echo "警告: 6080 端口未监听，查看容器日志："
            docker logs webtop --tail 50
          fi

      - name: 2. 安装 Cloudflared 并建立隧道
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          # 下载 cloudflared
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          
          # 安装为系统服务
          sudo cloudflared service install $CLOUDFLARE_TOKEN
          sudo systemctl start cloudflared
          sleep 15
          
          if systemctl is-active --quiet cloudflared; then
            echo "Cloudflare Tunnel 服务已启动"
          else
            echo "警告: Cloudflare Tunnel 服务未启动"
            sudo systemctl status cloudflared --no-pager
          fi
          
          echo ""
          echo "=========================================="
          echo "  >>> Webtop 服务已就绪 <<<"
          echo "  请在浏览器中访问你配置的域名"
          echo "  Cloudflare 路由需指向 http://localhost:6080"
          echo "=========================================="

      - name: 3. 保持运行 (48小时)
        run: |
          echo "服务器持续运行中..."
          for i in $(seq 1 2880); do
            sleep 60
            if [ $((i % 60)) -eq 0 ]; then
              echo "[$i/2880] 已运行 $((i / 60)) 小时"
            fi
          done
