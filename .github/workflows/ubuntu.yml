name: Ubuntu noVNC with Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. 安装 XFCE 桌面和 VNC Server
        run: |
          sudo apt update
          # 安装轻量桌面环境 XFCE
          sudo apt install -y xfce4 xfce4-goodies
          # 安装 TigerVNC Server
          sudo apt install -y tigervnc-standalone-server tigervnc-common
          
          # 创建 VNC 用户
          sudo useradd -m -s /bin/bash rdpuser
          echo "rdpuser:${{ secrets.PASSWORD }}" | sudo chpasswd
          sudo usermod -aG sudo rdpuser
          
          # 设置 VNC 密码（最长 8 位）
          VNC_PASS=$(echo "${{ secrets.PASSWORD }}" | cut -c1-8)
          sudo -u rdpuser mkdir -p ~/.vnc
          echo "$VNC_PASS" | sudo -u rdpuser vncpasswd -f > /home/rdpuser/.vnc/passwd
          sudo chmod 600 /home/rdpuser/.vnc/passwd
          sudo chown -R rdpuser:rdpuser /home/rdpuser/.vnc

      - name: 2. 配置 VNC 启动 XFCE
        run: |
          # 创建 VNC 启动脚本
          sudo -u rdpuser tee /home/rdpuser/.vnc/xstartup > /dev/null <<'EOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4
          EOF
          sudo chmod +x /home/rdpuser/.vnc/xstartup

      - name: 3. 启动 VNC Server
        run: |
          # 以 rdpuser 身份启动 VNC Server，监听 5901 端口
          sudo -u rdpuser vncserver :1 -geometry 1280x720 -depth 24
          sleep 3
          
          # 验证 VNC 是否在监听
          if ss -tlnp | grep -q ":5901"; then
            echo "VNC Server 已启动，监听 5901"
          else
            echo "警告: VNC Server 未启动"
          fi

      - name: 4. 安装并启动 noVNC
        run: |
          # 安装 noVNC 和 websockify
          sudo apt install -y novnc websockify
          
          # 启动 websockify，将 6080 端口转发到 VNC 的 5901
          websockify --web /usr/share/novnc/ 6080 localhost:5901 &
          sleep 5
          
          # 验证 6080 是否在监听
          if ss -tlnp | grep -q ":6080"; then
            echo "noVNC 已启动，监听 6080"
          else
            echo "警告: noVNC 未启动"
          fi

      - name: 5. 安装 Cloudflared 并建立隧道
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          # 下载 cloudflared
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          
          # 安装为服务
          sudo cloudflared service install $CLOUDFLARE_TOKEN
          sudo systemctl start cloudflared
          sleep 15
          
          # 检查服务状态
          if systemctl is-active --quiet cloudflared; then
            echo "Cloudflare Tunnel 服务已启动"
          else
            echo "警告: Cloudflare Tunnel 服务未启动"
          fi
          
          echo ""
          echo "=========================================="
          echo "  >>> noVNC 服务已就绪 <<<"
          echo "  请在浏览器中访问: https://novnc.styx.cc.cd"
          echo "  VNC 密码: 前 8 位"
          echo "=========================================="

      - name: 6. 保持运行
        run: |
          for i in $(seq 1 2880); do
            sleep 60
            if [ $((i % 60)) -eq 0 ]; then
              echo "[$i/2880] 已运行 $((i / 60)) 小时"
            fi
          done
