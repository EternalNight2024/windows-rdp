name: Ubuntu Webtop with WARP (Japan) + Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. 设置 WARP（宿主机级别，自动配置 Docker 走 WARP）
      - name: 设置 WARP 并配置 Docker
        uses: viperadnan-git/setup-warp@v1
        with:
          mode: client
          stack: dual
          configure_docker: true

      # 2. 尝试切换 WARP 出口为日本节点（多种方式优雅降级）
      - name: 切换 WARP 出口为日本节点
        run: |
          TOKYO_ENDPOINT="162.159.193.10:2408"

          echo "=== 当前 warp-cli 支持的子命令 ==="
          warp-cli --help 2>&1 | head -40 || true

          echo ""
          echo "=== 尝试方式 1: tunnel endpoint set ==="
          if sudo warp-cli --accept-tos tunnel endpoint set "$TOKYO_ENDPOINT" 2>/dev/null; then
            echo "✅ 方式 1 成功"
          else
            echo "⚠️ 方式 1 不可用，尝试方式 2"
            echo ""
            echo "=== 尝试方式 2: set-custom-endpoint ==="
            if sudo warp-cli --accept-tos set-custom-endpoint "$TOKYO_ENDPOINT" 2>/dev/null; then
              echo "✅ 方式 2 成功"
            else
              echo "⚠️ 方式 2 不可用，尝试方式 3"
              echo ""
              echo "=== 尝试方式 3: 环境变量 + 重装 ==="
              # 部分版本通过配置文件设置端点
              sudo mkdir -p /etc/cloudflare-warp 2>/dev/null || true
              sudo tee /etc/cloudflare-warp/endpoint.conf > /dev/null <<EOF
          endpoint = $TOKYO_ENDPOINT
          EOF
              echo "已写入配置文件（如果该版本支持）"
            fi
          fi

          echo ""
          echo "=== 重连使配置生效 ==="
          sudo warp-cli --accept-tos disconnect 2>/dev/null || true
          sleep 3
          sudo warp-cli --accept-tos connect 2>/dev/null || true
          sleep 10

          echo ""
          echo "=== 验证出口位置 ==="
          curl -s https://cloudflare.com/cdn-cgi/trace | grep -E "ip=|loc=|warp=" || echo "验证失败"

      # 3. 验证宿主机 WARP 状态
      - name: 验证 WARP 连接
        run: |
          echo "=== 宿主机 WARP 状态 ==="
          curl -s https://cloudflare.com/cdn-cgi/trace | grep -E "warp|loc=|ip="

      # 4. 启动 webtop 容器
      - name: 启动 webtop 容器
        run: |
          docker pull ghcr.io/linuxserver/webtop:ubuntu-xfce

          # setup-warp 会自动注入 --network host，不要手动再加
          docker run -d \
            --name=webtop \
            --shm-size=1gb \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Asia/Shanghai \
            ghcr.io/linuxserver/webtop:ubuntu-xfce

          echo "等待 webtop 启动..."
          sleep 30

          echo "=== 检查实际监听端口 ==="
          ss -tlnp | grep -E ":3000|:6080" || echo "未找到 webtop 监听端口"

      # 5. 验证容器内 WARP 出口
      - name: 验证容器内 WARP 出口
        run: |
          echo "=== 容器内 WARP 状态 ==="
          docker exec webtop sh -c "curl -s https://cloudflare.com/cdn-cgi/trace | grep -E 'ip=|loc=|warp='" 2>/dev/null || \
          docker exec webtop sh -c "wget -qO- https://cloudflare.com/cdn-cgi/trace | grep -E 'ip=|loc=|warp='" 2>/dev/null || \
          echo "容器内无法验证（可能缺少 curl/wget）"

      # 6. 本地验证端口
      - name: 本地验证端口
        run: |
          echo "=== 本地测试端口 ==="
          for port in 3000 6080; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$port 2>/dev/null || echo "000")
            echo "端口 $port: HTTP $code"
          done

      # 7. 安装 Cloudflared 并建立隧道
      - name: 安装 Cloudflared 并建立隧道
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

          echo "正在启动 Cloudflare Tunnel..."
          sudo nohup cloudflared tunnel --no-autoupdate run --token $CLOUDFLARE_TOKEN > /tmp/cloudflared.log 2>&1 &
          sleep 20

          if pgrep -f "cloudflared tunnel" > /dev/null; then
            echo "✅ Cloudflare Tunnel 已在后台运行"
            tail -10 /tmp/cloudflared.log
          else
            echo "⚠️ cloudflared 未运行，查看日志："
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "  >>> Webtop + WARP 服务已就绪 <<<"
          echo "  请确保 Cloudflare 路由指向实际监听端口"
          echo "=========================================="

      # 8. 保持运行 (48小时)
      - name: 保持运行 (48小时)
        run: |
          echo "服务器持续运行中..."
          for i in $(seq 1 2880); do
            sleep 60
            if [ $((i % 60)) -eq 0 ]; then
              echo "[$i/2880] 已运行 $((i / 60)) 小时"
            fi
          done
